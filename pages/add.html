<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciar Grupos de Mensagens</title>

    <!-- Bootstrap CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/static/styles.css" />
    <script src="/static/components.js"></script>
  </head>
  <body class="container mt-5">
    <h2 class="mb-4">Gerenciar Grupo de Mensagens</h2>
    <form id="grupoForm">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Grupo:</label>
        <input type="text" id="nome" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="convenios" class="form-label">Convênios:</label>
        <select
          id="convenios"
          size="1"
          class="form-select select2"
          multiple
        ></select>
      </div>

      <div class="mb-3">
        <label for="estipulantes" class="form-label">Estipulantes:</label>
        <select id="estipulantes" class="form-select select2" multiple></select>
      </div>

      <div class="mb-3">
        <label for="statusContratos" class="form-label"
          >Status dos Contratos:</label
        >
        <select
          id="statusContratos"
          class="form-select select2"
          multiple
        ></select>
      </div>

      <div class="mb-3">
        <label for="alertasContratos" class="form-label"
          >Alertas de Contratos:</label
        >
        <select
          id="alertasContratos"
          class="form-select select2"
          multiple
        ></select>
      </div>

      <div class="mb-3">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="ativo" checked>
          <label class="form-check-label" for="ativo" class="form-label">Grupo Ativo?</label>
        </div>
      </div>

      <div class="mb-3">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="pdf" >
          <label class="form-check-label" for="pdf" class="form-label">Envio de PDF?</label>
        </div>
      </div>

      <button type="button" class="btn btn-secondary" id="limparCamposBtn">
        Limpar
      </button>
      <button type="button" class="btn btn-primary" id="salvarGrupoBtn">
        Salvar Grupo
      </button>
    </form>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/scripts.js"></script>
  </body>
</html>
