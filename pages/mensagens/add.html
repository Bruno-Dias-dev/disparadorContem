<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/static/img/favicon.ico"
    />

    <title>Cadastrar Mensagens</title>

    <!-- Bootstrap CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/static/styles.css" />
    <script src="/static/components.js"></script>
  </head>
  <div class="text-end mb-3">
    <nav class="d-inline-block" aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Início</a></li>
        <li class="breadcrumb-item active" aria-current="page">Cadastro</li>
      </ol>
    </nav>
  </div>
  <body class="container mt-5">
    <h2 class="mb-4" style="color: #ed1c24">Cadastrar Mensagens</h2>
    <div class="card" style="border-color: #ed1c24; box-shadow: inset">
      <div class="card-body">
        <div class="card-header">
          <h5>
            Escreva a mensagem principal
            <button 
            type="button" 
            class="btn btn-sm btn-outline-secondary" 
            data-bs-toggle="tooltip" 
            data-bs-placement="top" 
            title="Nesta seção, você poderá cadastrar uma mensagem padrão que servirá como referência para a geração automática de mensagens similares por meio de inteligência artificial.">
              ?
            </button>
          </h5>
        </div>
        <form id="grupoForm">
          <div class="mb-3">
            <label for="mensagem" class="form-label">Título da Mensagem:</label>
            <input
              type="text"
              id="titulo"
              class="form-control"
              required
              placeholder="Ex: Mensagem 1 para cancelados"
            />
          </div>
          <div class="mb-3">
            <label for="mensagem" class="form-label">Texto:</label>
            <textarea
              type="text"
              id="mensagem"
              class="form-control"
              required
              rows="5"
            ></textarea>
          </div>
          <div class="mb-3">
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="ativo"
                checked
              />
              <label class="form-check-label" for="ativo" class="form-label"
                >Ativo?</label
              >
            </div>
          </div>

          <button type="button" class="btn btn-secondary" id="limparCamposBtn">
            Limpar
          </button>
          <button
            type="button"
            class="btn"
            id="salvarMsgBtn"
            style="background-color: #ed1c24; color: white"
          >
            Salvar Mensagem
          </button>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/mensagens.js"></script>
  </body>
</html>
