services:
  api:
    build: .
    container_name: disparador
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: always
    networks:
      - my_network  # <- mesma rede do outro stack
networks:
  my_network:
    external: true  # <- usa rede já criada no outro docker-compose
